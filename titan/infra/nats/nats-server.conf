# titan NATS/JetStream 로컬 개발 서버 설정
# 근거: protocol_icd.md §0(전송 계층) — RTSP(영상) 제외 전부 NATS 백본, JetStream 권장.
#
# 재사용: start-nats.ps1 에서 `nats-server.exe -c nats-server.conf` 로 기동.
# 인증은 로컬 개발 단계라 의도적으로 열어둠 — 배포 토폴로지 확정 후 잠글 것
# (protocol_icd.md §6 "아직 미확정" 참고, 이 설정 파일 범위 밖의 결정사항).

listen: 0.0.0.0:4222
http_port: 8222

jetstream {
  store_dir: "C:/working/insung_grapic/titan/infra/nats/data"
  max_mem_store: 1GB
  max_file_store: 10GB
}

server_name: titan-nats-dev
